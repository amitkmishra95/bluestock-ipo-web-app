<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<link rel="stylesheet" href="company.css">
<body>
  <div class="page">

    <div id="company-card" class="card company-card"></div>

    <div class="card">
      <h2 class="section-title">Analysis</h2>
      <div id="analysis" class="analysis-grid"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Pros and Cons</h2>
      <div id="pros-cons" class="pros-cons-grid"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Balance Sheet</h2>
      <div class="table-wrapper">
        <table id="balance-sheet"></table>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Profit and Loss</h2>
      <div class="table-wrapper">
        <table id="profit-loss"></table>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Cash Flow</h2>
      <div class="table-wrapper">
        <table id="cash-flow"></table>
      </div>
    </div>
<script src="company.js"></script>
  </div>
