<!DOCTYPE html>
<html>
<head>
    <title>Stock Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <img src="img1.png" alt="Stock Analytics Logo" class="logo" id="logo">
    <h1>Find the best with</h1>
    <h2 class="highlight">Stock Analytics</h2>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for a company">
        <div id="suggestions" class="suggestions-box"></div>
    </div>

    <p class="example">For Example:</p>
    <div class="chips">
        <span>TCS</span>
        <span>Infosys</span>
        <span>HDFC Bank</span>
        <span>Wipro</span>
        <span>SBI Life Insurance</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
